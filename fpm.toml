
# Drive fpm with commands like this:
#
#     fpm clean --all
#
#     # debug is the default profile
#     fpm build
#     fpm build --profile release
#     fpm build --verbose --flag -Wno-tabs
#     fpm @utils/build  # use options defined in file `utils/build.rsp`
#
#     # TODO: incorporate ifx testing into ci/cd.  Try ifort too
#     fpm build --compiler ifx --flag "-DSYNTRAN_INTEL -fpp"
#
#     # Turn on runtime subscript/string-index bounds checking
#     # (RC_SUBSCRIPT_OOB, R33): an out-of-bounds a[i]/s[i]/etc. becomes a
#     # normal syntran runtime error instead of a raw Fortran bounds-check
#     # abort.  CMake's Debug build type defines this automatically; fpm needs
#     # it spelled out explicitly.  See compiler.F90's `bounds_check` docstring
#     fpm build --profile debug --flag "-DSYNTRAN_BOUNDS_CHECK"
#     fpm test test --profile debug --flag "-DSYNTRAN_BOUNDS_CHECK"
#
#     # Use portable Fortran fallbacks instead of BLAS/LAPACK for `@`,
#     # std::solve(), and std::lu_factor()/std::lu_solve(), and don't link
#     # them.  See [features] below.  Features
#     # replace --profile (they can't be combined), so name release/debug here
#     fpm build --features release,noblas
#     fpm test test --features debug,noblas
#
#     # Defense-in-depth for release builds: force deterministic (nonzero)
#     # contents into otherwise-uninitialized stack/derived-type memory, so any
#     # remaining uninitialized read fails loudly/reproducibly instead of
#     # depending on incidental stack garbage (this is how the intermittent,
#     # release-only, Windows-only SIGSEGV from an uninitialized parser_t%repl
#     # was made to hide under -O0 but crash under -O3 for years)
#     fpm build --profile release --flag "-finit-local-zero -finit-derived"
#
#     # `runner` is a prefix to the syntran cmd.  anything after `-- ` is a cmd
#     # arg passed after `syntran`, e.g. the syntran filename
#     fpm run
#     fpm run -- samples/primes-3.syntran
#
#     fpm test       # all tests
#     fpm test test  # "short" tests only
#     fpm test long  # long tests only
#
#     # install to ~/bin/
#     fpm install --prefix ~
#
# fpm is smart.  If you run `fpm install` or `fpm test` without building first,
# it will automatically build
#
# Binary installers for fpm are available, but I built it from source:
#
#     git clone https://github.com/fortran-lang/fpm
#     cd fpm/
#     ./install.sh -h
#     ./install.sh --prefix='$HOME'  # '~' doesn't work
#     which fpm
#     ls ~/bin/
#     fpm --version

name = "syntran"
license = "BSD 3-Clause"
author = "Jeff Irwin"

## TODO: best practices for duplicating version here and in src?
#version = "0.0.27"

## Am I prepared to dox myself?
#maintainer = "jane.doe@example.com"
#copyright = "Copyright 2021, Jane Doe"

description = "syntran is an array-oriented language with an interpreter written in Fortran"
categories = ["interpreter"]
homepage = "https://github.com/JeffIrwin/syntran"

# TODO: set compiler flags, like -Wno-tab, etc.  Probably best done in a build
# script which sets --flag (or FPM_FFLAGS env var, but that should probably be
# left to other users to override my --flag args)

# There is deliberately no [build] table, because fpm only allows a build
# configuration in one place, and BLAS/LAPACK below needs [features.blas.build].
# Everything that used to be here is fpm's default anyway:
#
#     auto-executables = true
#     auto-tests       = true
#     auto-examples    = true
#     module-naming    = false

# BLAS/LAPACK for the matmul `@` operator, std::solve(), and
# std::lu_factor()/std::lu_solve(), through src/linalg.F90.  They're linked by default via the "blas" feature, which the
# default profile always enables, including with --profile debug/release.  On
# macOS they resolve to the Accelerate framework with no install.  Elsewhere,
# install an optimized implementation (e.g. libopenblas-dev), not the
# unoptimized reference libblas-dev/liblapack-dev.
#
# `--features release,noblas` (or `debug,noblas`) opts out: it defines
# SYNTRAN_NO_BLAS, so portable Fortran fallbacks are used instead of the calls,
# and nothing is linked.
#
# This needs fpm >= 0.13.0.  Earlier versions reject [features] as an unknown
# key.  It has to be `build.link`, not `link-time-flags`: fpm puts link flags
# *before* the objects and libraries, where GNU ld silently drops them
[features]
blas.build.link = ["lapack", "blas"]
noblas.preprocess.cpp.macros = "SYNTRAN_NO_BLAS"

# The native backend (`syntran --native`, src/native.F90) compiles through
# LLVM.  It's opt-in, because it needs LLVM installed (e.g. `brew install llvm`
# or `apt install llvm-dev`).  Without it, `--native` is an error.  fpm can't
# find the libraries itself, so name their directory in LIBRARY_PATH:
#
#     export LIBRARY_PATH=$(llvm-config --libdir)
#     fpm build --features debug,llvm-blas
#     fpm build --features debug,noblas,llvm
#
# Features replace --profile, so name debug/release here too.  fpm allows only
# one feature to have a `build` table, so `llvm` can't be added to `blas`.
# `llvm-blas` is both of them
llvm.build.link = ["LLVM"]
llvm.preprocess.cpp.macros = "SYNTRAN_LLVM"
llvm-blas.build.link = ["LLVM", "lapack", "blas"]
llvm-blas.preprocess.cpp.macros = "SYNTRAN_LLVM"

[profiles]
default = ["blas"]

[install]
library = true
# To get module usage working with nvim gfortran linting, run
# `fpm install --prefix ./build` with library set to true here to place the .mod
# files somewhere that nvim/gfortran can find them, as opposed to the default
# location build/gfortran_{random-hex-shit}/*.mod

[[executable]]
name = "syntran"
source-dir = "src"
main = "main.f90"

[[test]]
name = "test"
source-dir = "src/tests/"
main = "test.f90"

[[test]]
#[[example]]  # example would exclude this when running `fpm test`
name = "long"
source-dir = "src/tests/"
main = "long.f90"

