{
# can haz comments?
"name": "CI",
"on": [
	"push"
],
"jobs": {
	"test-os": {
		"name": "Build on ${{ matrix.os }}",
		"runs-on": "${{ matrix.os }}",
		"strategy": {
			"matrix": {
				"os": [
					"ubuntu-24.04",
					"windows-latest",
					"macOS-latest"
				]
			}
		},
		"steps": [
			{
				"uses": "actions/checkout@v7",
				"with": {
					"submodules": true
				}
			},
			{
				"uses": "fortran-lang/setup-fpm@v10",
				"with": {
					"github-token": "${{ secrets.GITHUB_TOKEN }}"
				}
			},
			{
				"if": "matrix.os == 'macOS-latest'",
				"name": "unfuck stupid macos sed",  # https://stackoverflow.com/a/60562182/4347028
				"run": "brew install gnu-sed && sudo cp $(which gsed) /usr/local/bin/sed"
			},
			{
			  "run": "bash utils/gen-header.sh"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Check syntax_node_t copy/destroy/move sync",
				"run": "bash utils/check-node-sync.sh"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Check embedded transpiler runtime is up to date",
				"run": "bash src/gen_transpile_rt.sh && git diff --exit-code src/transpile_rt.f90"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Check embedded native runtime is up to date",
				"run": "bash src/gen_native_rt.sh && git diff --exit-code src/native_rt.f90"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Set ubuntu PATH",
				"run": "echo \"$HOME/bin\" >> $GITHUB_PATH"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"run":
				"
					# libopenblas-dev (not the reference libblas-dev/ \n
					# liblapack-dev) provides the fast BLAS/LAPACK for \n
					# fpm.toml's `link`.  macOS gets Accelerate for free \n
					sudo apt-get install gfortran-14 libopenblas-dev \n

					# Ubuntu's `-llapack -lblas` would resolve to shared \n
					# libs, which a bare container doesn't have.  Like \n
					# Dockerfile.rocky, link libopenblas.a (which also \n
					# contains LAPACK) statically through a private dir \n
					# that is first in the linker search path \n
					a=$(find /usr/lib -name libopenblas.a | head -n 1) \n
					[[ -n \"$a\" ]] \n
					sudo mkdir -p /opt/blas-static \n
					sudo ln -sf \"$a\" /opt/blas-static/libblas.a \n
					sudo ln -sf \"$a\" /opt/blas-static/liblapack.a \n
				"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Test fpm debug",
				"env": {
					"FPM_FC": "gfortran-14"
				},
				"run":
				"
					set -exu \n
					gfortran --version \n
					gfortran-14 --version \n

					# This is a quick debug build test.  Debug compiles faster \n
					# than release optimization \n

					lflags=\"-static-libgcc -static-libgfortran -static-libquadmath\" \n

					fpm build --profile debug --link-flag \"$lflags\" \n

					# Run with `<` to test the REPL shell \n
					#
					# TODO: test REPL with more complex input, but come up with
					# a way to filter-out 'syntran$ ' and '> ' prompts from
					# output.  Maybe add a '-qq' option to make it even quieter?
					# Or keep grepping with well-formatted printed output
					# \n
					ans=$(fpm run --profile debug --link-flag \"$lflags\"
						< samples/arithmetic2.syntran
						| grep -o \"{ans = '.*'}\" | grep -o '[0-9]*'
					) \n
					[[ \"$ans\" != \"175\" ]] && exit 1 \n

					ans=$(fpm run --profile debug --link-flag \"$lflags\"
						< samples/arrays.syntran
						| grep -o \"{ans = '.*'}\" | grep -o \"'.*'\"  | grep -o \"[^']*\"
					) \n
					[[ \"$ans\" != \"[101, 104, 107, 110]\" ]] && exit 1 \n

					# No-arg readln()/eof() should read from stdin \n
					ans=$(printf 'a\\nb\\nc\\n' | fpm run --profile debug --link-flag \"$lflags\"
						-- -c 'let n = 0; for i in [0: 3] { let line = readln(); n += 1; } println(n);'
					) \n
					[[ \"$(echo $ans)\" != \"3\" ]] && exit 1 \n

					ans=$(printf 'x\\n' | fpm run --profile debug --link-flag \"$lflags\"
						-- -c 'readln(); readln(); println(eof());'
					) \n
					[[ \"$(echo $ans)\" != \"true\" ]] && exit 1 \n

					# Test samples from syntran-explorer \n
					# TODO: test this in the release binary \n
					dir_='src/tests/test-src/explorer/' \n
					for f in $dir_/*.syntran ; do
						fpm run --profile debug --link-flag \"$lflags\"
							-- -q $f > ${f%.syntran}.out \n
						diff ${f%.syntran}.out ${f%.syntran}.exp \n
					done

					# Fortran API examples in example/.  They `error stop` on a \n
					# wrong result, so any failure fails the job.  They read \n
					# example/hello.syntran relative to the project root \n
					for ex in hello_world eval_basic eval_errors interpret_file ; do
						fpm run --example $ex --profile debug --link-flag \"$lflags\" \n
					done

					# Short tests only.  Long tests are only done in release \n
					fpm test test --profile debug --link-flag \"$lflags\" \n

					# Same short tests again, with runtime subscript/string-index \n
					# bounds checking (RC_SUBSCRIPT_OOB, R33) turned on -- exercises \n
					# unit_test_bounds_check, which is a no-op without this flag \n
					fpm test test --profile debug --link-flag \"$lflags\" --flag \"-DSYNTRAN_BOUNDS_CHECK\" \n
				"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Test fpm default",

				"env": {
					"FPM_FC": "gfortran-14"
				},
				"run":
				"
					set -exu \n
					gfortran --version \n
					gfortran-14 --version \n

					# This is the pack linux stage, but it also does some \n
					# testing.  CI/CD could use some disentangling \n

					fpm install
					  --profile release
					  --link-flag
					  '-L/opt/blas-static -static-libgcc -static-libgfortran -static-libquadmath'
					  --prefix='$HOME' \n

					# TODO: copy to a subdir for easier upload \n
					cp $HOME/bin/syntran . \n
					which syntran \n
					which patchelf \n
					chmod +x ./syntran \n
					patchelf --set-rpath '$ORIGIN' ./syntran \n

					# BLAS/LAPACK and the gfortran runtime must be static, \n
					# or the binary won't run in a bare container \n
					ldd ./syntran \n
					if ldd ./syntran | grep -Eq 'blas|lapack|gfortran' ; then exit 1 ; fi \n
					./syntran -c 'let A = [2.0, 1.0, 1.0, 3.0; 2, 2]; println(std::solve(A, [3.0, 5.0])); println(A @ A);' \n

					dir_='src/tests/test-src/explorer/' \n
					for f in $dir_/*.syntran ; do
						fpm run
							--profile release
							--link-flag
							'-L/opt/blas-static -static-libgcc -static-libgfortran -static-libquadmath'
							-- -q $f > ${f%.syntran}.out \n
						diff ${f%.syntran}.out ${f%.syntran}.exp \n
					done

					# Test 'shebang' usage with no 'syntran' cmd prefix \n
					chmod +x ./samples/shebang.syntran \n
					./samples/shebang.syntran \n

					# Test quines. May not be perfect with whitespace on Windows \n

					syntran -q samples/quine-1.syntran > quine-1.syntran \n
					diff quine-1.syntran samples/quine-1.syntran \n

					syntran -q samples/quine-2.syntran > quine-2.syntran \n
					diff quine-2.syntran samples/quine-2.syntran \n

					syntran -q samples/quine-3.syntran > quine-3.syntran \n
					diff quine-3.syntran samples/quine-3.syntran \n

					# No significant difference between release and (default) debug profile. \n
					# Maybe that will change after I copy the other half of AOC tests \n
					fpm test test --profile release \n
					fpm test long --profile release \n
				"
			},
			{
				"if": "matrix.os == 'windows-latest'",
				"name": "Install OpenBLAS windows",
				"run":
				"
					# MSYS2 is preinstalled on the runner at C:\\msys64, but \n
					# not on the PATH.  Its OpenBLAS is built with \n
					# DYNAMIC_ARCH (CPU kernel picked at run time, so the \n
					# shipped binary is portable) and has a static archive \n
					# with both BLAS and LAPACK.  ucrt64 matches the \n
					# runner's UCRT mingw gfortran \n
					C:\\msys64\\usr\\bin\\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-openblas \n

					# fpm.toml's `blas` feature links `-llapack -lblas`, so \n
					# present the one archive under both names in a private \n
					# dir.  Don't put C:\\msys64\\ucrt64\\lib itself on -L, \n
					# since its libgfortran.a/libgomp.a would shadow the \n
					# runner toolchain's \n
					New-Item -ItemType Directory -Force build/openblas | Out-Null \n
					Copy-Item C:\\msys64\\ucrt64\\lib\\libopenblas.a build/openblas/libblas.a \n
					Copy-Item C:\\msys64\\ucrt64\\lib\\libopenblas.a build/openblas/liblapack.a \n

					# Log the toolchain's CRT (--with-default-msvcrt) \n
					gfortran -v \n
				"
			},
			{
				"if": "matrix.os == 'windows-latest'",
				"name": "Test fpm windows",
				"run":
				"
					# `-Wl,--wrap=setlocale` is THE fix for the intermittent \n
					# Windows SIGSEGV (~0.7-2% of runs).  libgfortran on mingw \n
					# (no uselocale) retains the pointer from setlocale(...,NULL) \n
					# across a later setlocale() call, which C99 7.11.1.1p8 does \n
					# not allow; the stale pointer makes UCRT's mbstowcs() scan \n
					# freed memory.  It usually finds a NUL harmlessly, hence the \n
					# ~1% rate from an otherwise deterministic suite.  See \n
					# __wrap_setlocale() in src/c/isocline_wrap.c.  Measured 0 \n
					# crashes in 1600 suite runs + 6000 reproducer reps. \n
					# \n
					# `-Wl,--stack,...` raises the 2 MB default PE stack reserve \n
					# so deeply nested input cannot exhaust it.  Robustness only. \n
					# `-static` is kept for a self-contained binary. \n
					# \n
					# All go through `--flag`, not `--link-flag`, which fpm \n
					# 0.12-alpha silently ignores. \n
					# \n
					# BLAS/LAPACK is OpenBLAS from the \"Install OpenBLAS \n
					# windows\" step, found through `-Lbuild/openblas`.  It's \n
					# built with OpenMP, so `-fopenmp` pulls in libgomp \n
					fpm test test --profile release --flag \"-static -fopenmp -Lbuild/openblas -Wl,--wrap=setlocale -Wl,--stack,67108864\" \n
					fpm test long --profile release --flag \"-static -fopenmp -Lbuild/openblas -Wl,--wrap=setlocale -Wl,--stack,67108864\" \n
				"
			},
			{
				"if": "matrix.os == 'macOS-latest'",
				"run": "
					brew install gcc@14 &&
					brew reinstall gcc@14"
			},
			{
				"name": "Build",
				"run":
				"
					#export OMP_NUM_THREADS=1 \n
					bash ./build.sh debug \n
					#ls -ltrh build/Debug \n
				"
			},
			{
				"name": "Test README code blocks",
				"shell": "bash",
				"run":
				"
					bash ./utils/test-readme.sh \n
				"
			},
			{
				"name": "Test samples",
				"shell": "bash",
				"run":
				"
					bash ./utils/test-samples.sh \n
				"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Test transpiler",
				"shell": "bash",
				"run":
				"
					# Transpile every test program and sample to Fortran, \n
					# compile it, and compare its output with the interpreter's \n
					bash ./utils/test-transpile.sh ./build/Debug/syntran gfortran-14 \n
				"
			},
			{
				"if": "matrix.os != 'windows-latest'",
				"name": "Test debug",
				"run":
				"
					./build/Debug/syntran < samples/arithmetic.syntran  \n
					#./build/Debug/syntran < samples/bad-syntax.syntran \n
					time ./build/Debug/test \n
				"
			},
			{
				"if": "matrix.os != 'windows-latest'",
				"name": "Test release",
				"run":
				"
					bash ./build.sh release \n
					time ./build/Release/test \n
				"
			},
			{
				"if": "matrix.os == 'macOS-latest'",
				"name": "Test long macOS",
				"run":
				"
					time ./build/Release/long \n
				"
			},
			{
				"if": "matrix.os == 'windows-latest'",
				"name": "Pack Windows",
				"run":
				"
					# Reuse the already-built, already-tested static fpm \n
					# release binary from the \"Test fpm windows\" step instead \n
					# of rebuilding from scratch with cmake.  --prefix places \n
					# it in a predictable location for packaging \n
					fpm install --profile release --flag \"-static -fopenmp -Lbuild/openblas -Wl,--wrap=setlocale -Wl,--stack,67108864\" --prefix ./build/ \n

					copy .\\build\\bin\\syntran.exe .\\ \n

					# OpenBLAS, libgomp and libgfortran must be linked in \n
					# statically, or the exe won't run without the toolchain \n
					objdump -p .\\syntran.exe | Select-String \"DLL Name\" \n
					if (objdump -p .\\syntran.exe | Select-String -Pattern \"openblas|libgomp|libgfortran\") { exit 1 } \n
				"
			},
			{
				"if": "matrix.os == 'macOS-latest'",
				"name": "Pack macOS",
				"run":
				"
					set -exu \n
					#set -x \n

					gfortran-14 --version \n
					which gfortran-14 \n

					bash ./build.sh release \n

					# TODO: copy to a subdir for easier upload \n

					cp ./build/Release/syntran . \n

					otool -L ./syntran \n

					GCC_LIB_DIR=/opt/homebrew/opt/gcc@14/lib/gcc/14 \n

					#ls ${GCC_LIB_DIR} \n

					cp ${GCC_LIB_DIR}/libgomp.1.dylib . \n

					#/usr/lib/libSystem.B.dylib

					install_name_tool -change
						\"${GCC_LIB_DIR}/libgomp.1.dylib\"
						\"@executable_path/libgomp.1.dylib\"
						\"./syntran\" \n

					chmod +x ./syntran \n
					./syntran --version \n
					#cat ./src/compiler.F90 \n
				"
			},
			{
				"uses": "actions/upload-artifact@v7",
				"if": "matrix.os == 'macOS-latest'",
				"with": {
					"path": "./syntran\n./libgomp.1.dylib\n./LICENSE\n./THIRD_PARTY_NOTICES.md",
					"name": "syntran-macos"
				}
			},
			{
				"uses": "actions/upload-artifact@v7",
				"if": "matrix.os == 'windows-latest'",
				"with": {
					"path": "./syntran.exe\n./LICENSE\n./THIRD_PARTY_NOTICES.md",
					"name": "syntran-windows"
				}
			},
			{
				"uses": "actions/upload-artifact@v7",
				"if": "matrix.os == 'ubuntu-24.04'",
				"with": {
					"path": "./syntran\n./LICENSE\n./THIRD_PARTY_NOTICES.md",
					"name": "syntran-ubuntu"
				}
			},
			{
				# Test the binary artifact that was uploaded by this branch's run
				"uses": "actions/download-artifact@v7",
				"if": "matrix.os == 'ubuntu-24.04'",
				"with":
				{
					"name": "syntran-ubuntu",
					"path": "docker/artifact-download",
				},
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"run":
				"
					docker build ./docker/ --file ./docker/Dockerfile.branch-ubuntu \n
				"
			},
		]
	},
	"build-rocky": {
		# Build and package syntran from source in rocky linux Dockerfile
		"name": "Build on rocky linux",
		"runs-on": "ubuntu-latest",
		"steps": [
			{
				"uses": "actions/checkout@v7",
				"with": {
					"submodules": true
				}
			},
			{
				"name": "Build docker",
				"run":
				"
					docker --version \n
					docker build .
						--file Dockerfile.rocky
						--build-arg BRANCH=${{ github.ref_name }}
						-t sy \n

					## Test run \n
					#docker run --entrypoint syntran sy --version \n
					docker run --entrypoint /workdir/syntran/bin/syntran sy --version \n

					# Start run in background (-d) with container name sy-ctr \n
					sudo docker run --name sy-ctr -d -it sy \n

					# Copy artifact from container \n
					sudo docker cp sy-ctr:/workdir/syntran/bin/syntran-linux.tgz . \n

					# Extract to repackage as zip during upload \n
					mkdir bin \n
					cd bin \n
					tar xvf ../syntran-linux.tgz \n
				"
			},
			{
				"uses": "actions/upload-artifact@v7",
				"with": {
					"path": "./bin/syntran\n./bin/LICENSE\n./bin/THIRD_PARTY_NOTICES.md",
					"name": "syntran-linux"
				}
			},
			{
				# Get the binary artifact that was uploaded by this branch's run
				"uses": "actions/download-artifact@v7",
				"with":
				{
					"name": "syntran-linux",
					"path": "docker/artifact-download",
				},
			},
			{
				# Test the binary artifact that was uploaded by this branch's run
				"run":
				"
					bash ./utils/test-branch.sh \n
				"
			},
		]
	},
	"test-gfortran": {
		"name": "Test with gfortran-${{ matrix.gfortran }}",
		"runs-on": "${{ matrix.os }}",
		"strategy": {
			"matrix": {
				"os": [
					"ubuntu-latest"
				],
				#"gfortran": [9, 10, 11, 12]  # gfort 9 started segfaulting with the introduction of fortran submodules circa 9ae38b9d
				"gfortran": [10, 11, 12, 13, 14]  # gfort <= 8 not available by default on github ci workers
			}
		},
		"steps": [
			{
				"uses": "actions/checkout@v7",
				"with": {
					"submodules": true
				}
			},
			{
				"uses": "fortran-lang/setup-fpm@v10",
				"with": {
					"github-token": "${{ secrets.GITHUB_TOKEN }}"
				}

			},
			{
				"if": "matrix.os == 'ubuntu-latest'",
				"run": "sudo apt-get install gfortran-${{ matrix.gfortran }} libopenblas-dev"
			},
			{
				"if": "matrix.os == 'ubuntu-latest'",
				"name": "Test ubuntu gfortran-${{ matrix.gfortran }}",
				"env": {
					"FPM_FC": "gfortran-${{ matrix.gfortran }}"
				},
				"run":
				"
					set -exu \n
					fpm test test --profile release --verbose --flag -Wno-tabs \n
					fpm test long --profile release --flag -Wno-tabs \n
				"
			}
		]
	},
	# The native backend (`syntran --native`) is opt-in, because it needs LLVM, so
	# the jobs above never build it.  This one does, and checks it against the
	# interpreter.  Ubuntu's llvm-dev is LLVM 18, and Homebrew's is the latest, so
	# together they bracket the versions that src/llvm_c.f90 has to work with
	"test-llvm": {
		"name": "Test native backend on ${{ matrix.os }}",
		"runs-on": "${{ matrix.os }}",
		"strategy": {
			"matrix": {
				"os": [
					"ubuntu-24.04",
					"macOS-latest"
				]
			}
		},
		"steps": [
			{
				"uses": "actions/checkout@v7",
				"with": {
					"submodules": true
				}
			},
			{
				"uses": "fortran-lang/setup-fpm@v10",
				"with": {
					"github-token": "${{ secrets.GITHUB_TOKEN }}"
				}
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Install LLVM ubuntu",
				"run": "sudo apt-get install gfortran-14 libopenblas-dev llvm-dev cmake"
			},
			{
				"if": "matrix.os == 'macOS-latest'",
				"name": "Install LLVM macOS",
				"run": "brew install gcc@14 llvm"
			},
			{
				"name": "Test fpm with LLVM",
				"shell": "bash",
				"env": {
					"FPM_FC": "gfortran-14"
				},
				"run":
				"
					set -exu \n
					# Homebrew's llvm is keg-only, so it's not on the PATH \n
					llvm_config=\"$(command -v llvm-config || echo $(brew --prefix llvm)/bin/llvm-config)\" \n
					$llvm_config --version \n

					# fpm can't find the libraries by itself \n
					export LIBRARY_PATH=\"$($llvm_config --libdir)\" \n

					# Not just the short tests: the groups that need LLVM check the \n
					# diagnostics and the IR of the native backend \n
					fpm test test --features debug,llvm-blas --flag -Wno-tabs \n

					# A stable path to the binary, which would otherwise be in a \n
					# directory named by a hash of the flags \n
					fpm install --features debug,llvm-blas --flag -Wno-tabs --prefix ./build/native/ \n

					# End to end, with the C compiler that links the program \n
					./build/native/bin/syntran --native hello -c 'println(\"hello \", 6 * 7);' \n
					[[ \"$(./hello)\" == \"hello 42\" ]] \n
				"
			},
			{
				# Only on x86, where the interpreter doesn't fuse multiply-adds.  On
				# an arm64 mac it does, and a compiled program doesn't, so the last
				# digits of some samples would differ for no reason
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Test native backend",
				"shell": "bash",
				"run":
				"
					set -exu \n
					# Compile every test program and sample, run it, and compare \n
					# its output with the interpreter's \n
					bash ./utils/test-transpile.sh --backend native ./build/native/bin/syntran \n
				"
			},
			{
				"if": "matrix.os == 'ubuntu-24.04'",
				"name": "Test cmake with LLVM",
				"shell": "bash",
				"run":
				"
					set -exu \n
					cmake -S . -B build/llvm -DCMAKE_BUILD_TYPE=Debug -DSYNTRAN_LLVM=ON -DCMAKE_Fortran_COMPILER=gfortran-14 -DCMAKE_PREFIX_PATH=\"$(llvm-config --prefix)\" \n
					cmake --build build/llvm -j 4 \n
					./build/llvm/syntran --native hello-cmake -c 'println(\"hello \", 6 * 7);' \n
					[[ \"$(./hello-cmake)\" == \"hello 42\" ]] \n
					./build/llvm/test \n
				"
			}
		]
	},
	"test-compilers": {
		"name": "Test with ${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.version }}",
		"timeout-minutes": 120,
		"runs-on": "${{ matrix.os }}",
		"strategy": {
			"fail-fast": false,
			"matrix": {
				"os": [
					"ubuntu-latest"
				],
				"toolchain": [
					#{"compiler": "intel", "version": "2026.0"},   # not supported yet by setup-fortran as of 2026-06-06
					{"compiler": "intel", "version": "2025.2"},
					#{"compiler": "intel", "version": "2025.1"},  # works
					#{"compiler": "intel", "version": "2024.2"},  # internal compiler error on fn array cat in declare_intr_fns()
					#{"compiler": "intel", "version": "2023.1"},

					##{"compiler": "intel", "version": "2023.0"},  # crashes on ` 	do while (is_whitespace(context%text(j:j)))`
					##{"compiler": "intel", "version": "2022.2"},  # ifx 2022.2 doesn't have `do while ()` :(

					{"compiler": "intel-classic", "version": "2021.10"},
					#{"compiler": "intel-classic", "version": "2021.1"},  # complains about coarrays???
				]
			}
		},
		"steps": [
			{
				"uses": "actions/checkout@v7",
				"with": {
					"submodules": true
				}
			},
			{
				"uses": "fortran-lang/setup-fpm@v10",
				"with": {
					"github-token": "${{ secrets.GITHUB_TOKEN }}"
				}

			},
			{
				"uses": "fortran-lang/setup-fortran@v1",
				"id": "setup-fortran",
				"with": {
					"compiler": "${{ matrix.toolchain.compiler }}",
					"version": "${{ matrix.toolchain.version }}"
				}
			},
			{
				"if": "matrix.os == 'ubuntu-latest'",
				"name": "Install BLAS/LAPACK",
				"run": "sudo apt-get install -y libopenblas-dev"
			},
			{
				"if": "matrix.os == 'ubuntu-latest'",
				"name": "Test ${{ matrix.toolchain.compiler }} ${{ matrix.toolchain.version }}",
				"timeout-minutes": 90,
				"env": {
					"FPM_FC": "${{ env.FC }}"
				},
				"run":
				"
					set -exu \n

					ulimit -s unlimited \n

					# fpm's Intel debug profile uses `-check all`, which makes \n
					# every array-temporary copy-in print a forrtl warning (406) \n
					# with a backtrace.  They're harmless, so turn just that one \n
					# check off. \n
					fpm test test --profile debug   --verbose --flag \"-DSYNTRAN_INTEL -fpp -check noarg_temp_created\" \n

					# Same short tests again, with runtime subscript/string-index \n
					# bounds checking (RC_SUBSCRIPT_OOB, R33) turned on -- exercises \n
					# unit_test_bounds_check, which is a no-op without this flag \n
					fpm test test --profile debug   --verbose --flag \"-DSYNTRAN_INTEL -DSYNTRAN_BOUNDS_CHECK -fpp -check noarg_temp_created\" \n

					# The optimized -Ofast build goes through cmake instead of \n
					# fpm (see CMakeLists.txt), which also builds the core lib \n
					# once for both the test and long exes, instead of fpm's \n
					# separate rebuild per target. \n
					SYNTRAN_INTEL=1 bash ./build.sh release \n
					./build/Release/test \n

					# Long/AOC suite is the CI bottleneck and runs single-threaded \n
					# per process (syntran's interpreter has no internal \n
					# parallelism). A static per-process shard split leaves \n
					# cores idle once their shard's tests finish, so instead \n
					# use a dynamic work queue: xargs keeps N processes busy, \n
					# handing each one the next test index as soon as it's \n
					# free, so slow AOC problems don't bottleneck one shard. \n
					n=$(nproc) \n
					count=$(./build/Release/long --count) \n
					if seq 0 $((count-1)) | xargs -P \"$n\" -I{}
						sh -c './build/Release/long --test {} > long.{}.log 2>&1' ; then \n
						rc=0 \n
					else \n
						rc=$? \n
					fi \n
					cat long.*.log \n
					exit $rc \n
				"
			}
		]
	},
	"test-alpine-docker-build": {
		# Build syntran from source in default top-level alpine Dockerfile
		"name": "Test alpine docker build",
		"runs-on": "ubuntu-latest",
		"steps": [
			{
				"uses": "actions/checkout@v7",
				"with": {
					"submodules": true
				}
			},
			{
				"name": "Test alpine docker",
				"run":
				"
					docker --version \n

					# Latest alpine version in default 'Dockerfile' \n
					docker build . -t sy \n
					docker run --entrypoint syntran sy --version \n
					docker run sy --version # syntran is already the default entrypoint \n
					docker run sy -c \"1 + 2;\" \n
					ans=$(docker run sy -c \"1 + 2;\"  | tr -d '[:space:]') \n
					if [[ \"$ans\" == \"3\" ]] ; then \n
						echo \"win\" \n
					else \n
						echo \"fail\" \n
						exit 1 \n
					fi \n

					docker build . --file docker/Dockerfile.alpine -t sy \n
					docker run --entrypoint syntran sy --version \n
					docker run sy --version # syntran is already the default entrypoint \n
					docker run sy -c \"1 + 2;\" \n
					ans=$(docker run sy -c \"1 + 2;\"  | tr -d '[:space:]') \n
					if [[ \"$ans\" == \"3\" ]] ; then \n
						echo \"win\" \n
					else \n
						echo \"fail\" \n
						exit 1 \n
					fi \n
				"
			},
		]
	},
	"test-linux-release-bin": {
		# Test binary syntran installations on dockerfiles from ./docker/
		# dir.  These download the latest github "release", so there will be
		# a lag between when you build the release and manually upload a
		# binary package to github
		"name": "Test linux release bin",
		"runs-on": "ubuntu-latest",
		"steps": [
			{"uses": "actions/checkout@v7"},
			{
				"name": "Test linux release bin",
				"run":
				"
					bash ./utils/test-bin.sh \n
				"
			},
		]
	},
	"test-macos-bin": {
		"name": "Test macos bin",
		"runs-on": "macOS-latest",
		"steps": [
			{
				"name": "Test macos bin",
				"run":
				"
					set -exu \n

					# Test this to run syntran without homebrew gcc lib paths \n
					brew remove gcc@14 || true \n

					mv /opt/homebrew/bin /opt/homebrew/bin-BACKUP || true \n
					mv /opt/homebrew/opt /opt/homebrew/opt-BACKUP || true \n
					mv /opt/homebrew/Cellar /opt/homebrew/Cellar-BACKUP || true \n
					#ls /opt/homebrew/ \n

					# TODO: put curl+unzip in a retry loop. Download can flake
					# out sometimes but curl doesn't really return an exit code \n

					curl -LO \"https://github.com/JeffIrwin/syntran/releases/latest/download/syntran-macos.zip\" \n
					unzip syntran-macos*.zip \n
					chmod +x ./syntran \n
					./syntran -h \n
					./syntran --version \n

					./syntran -c 'println(\"hello world\");' \n
					./syntran -c '1 + 2 * 3;' \n
					./syntran -c '4 + 5 * [6: 10];' \n
					./syntran -c 'sum([0: 101]);' \n

					otool -L ./syntran \n
				"
			},
		]
	},
	"test-windows-bin": {
		"name": "Test windows bin",
		"runs-on": "windows-latest",
		"steps": [
			{
				"name": "Test windows bin",
				"run":
				"
					curl -LO \"https://github.com/JeffIrwin/syntran/releases/latest/download/syntran-windows.zip\" \n
					tar -xvf syntran-windows.zip \n
					dir \n
					.\\syntran.exe -h \n
					.\\syntran.exe --version \n

					.\\syntran.exe -c \"println(\"\"hello world\"\");\" \n
					.\\syntran.exe -c \"1 + 2 * 3;\" \n
					.\\syntran.exe -c \"4 + 5 * [6: 10];\" \n
					.\\syntran.exe -c \"sum([0: 101]);\" \n
				"
			},
		]
	},
	"test-windows-branch-bin": {
		# Smoke-test the packaged binary artifact built by this branch's
		# own run (as opposed to "test-windows-bin", which tests the
		# latest published release)
		"name": "Test windows branch bin",
		"needs": ["test-os"],
		"runs-on": "windows-latest",
		"steps": [
			{
				"name": "Diagnose DLL search path before hiding",
				"run":
				"
					where.exe libwinpthread-1.dll \n
					where.exe libgcc_s_seh-1.dll \n
				"
			},
			{
				"name": "Hide system DLLs",
				"run":
				"
					# Test this to run syntran without the runner image's \n
					# pre-installed mingw64/strawberry/git toolchain DLLs.  Skip dirs \n
					# that a given runner image doesn't have \n
					foreach ($d in @('C:\\mingw64', 'C:\\Strawberry', 'C:\\Program Files\\Git\\mingw64')) { \n
						if (Test-Path $d) { Move-Item $d \"$d-BACKUP\"; echo \"hid $d\" } \n
						else { echo \"not found: $d\" } \n
					} \n
				"
			},
			#{
			#	"name": "Diagnose DLL search path after hiding",
			#	"run":
			#	"
			#		where.exe libwinpthread-1.dll \n
			#		where.exe libgcc_s_seh-1.dll \n
			#	"
			#},
			{
				# Test the binary artifact that was uploaded by this branch's run
				"uses": "actions/download-artifact@v7",
				"with":
				{
					"name": "syntran-windows",
					"path": "artifact-download",
				},
			},
			{
				"name": "Test windows branch bin",
				"run":
				"
					cd artifact-download \n
					dir \n
					.\\syntran.exe -h \n
					.\\syntran.exe --version \n

					.\\syntran.exe -c \"println(\"\"hello world\"\");\" \n
					.\\syntran.exe -c \"1 + 2 * 3;\" \n
					.\\syntran.exe -c \"4 + 5 * [6: 10];\" \n
					.\\syntran.exe -c \"sum([0: 101]);\" \n
				"
			},
		]
	},
